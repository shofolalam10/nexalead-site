<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a Call | Nexa Lead</title>
<meta name="description" content="Book a call with Nexa Lead, a Wichita business helping local service companies grow.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="assets/favicon-blue.png">
<link rel="preload" href="assets/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/site.css">
<style>
.book{max-width:620px;margin:0 auto;padding:56px 24px 40px}
.book h1{font-size:clamp(36px,6vw,52px);margin-bottom:14px}
.book .lead{font-size:19px;margin-bottom:28px}
.book .assure{margin:22px 0 0;justify-content:flex-start}
.page-foot{padding:8px 24px 48px;text-align:center;color:var(--muted);font-size:15px}
.page-foot a{color:var(--muted)}
</style>
</head>
<body>
<div class="page-top"><div class="wrap">
  <a class="logo" href="index.html" aria-label="Nexa Lead home"><img src="assets/logo-n.png" width="26" height="32" alt="">Nexa Lead</a>
  <a class="back" href="index.html">Back to website</a>
</div></div>

<main class="book">
  <h1>Book a call</h1>
  <p class="lead">Tell us a little about your business and we will reach out to set up a short call about how we can help you grow. No pressure and no obligation.</p>

  <form class="form" id="form" novalidate>
    <input class="hp" type="text" name="company_website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <label for="f_name">Your name</label>
    <input id="f_name" name="name" autocomplete="name" required>
    <label for="f_biz">Business name</label>
    <input id="f_biz" name="business" autocomplete="organization" required>
    <label for="f_phone">Phone</label>
    <input id="f_phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required>
    <label for="f_trade">Type of business</label>
    <select id="f_trade" name="trade">
      <option>Roofing</option><option>HVAC</option><option>Plumbing</option><option>Electrical</option><option>Landscaping</option><option>Property management</option><option>Auto repair</option><option>Salon or barber</option><option>Other</option>
    </select>
    <label for="f_msg">Anything we should know? <span class="opt">(optional)</span></label>
    <textarea id="f_msg" name="message"></textarea>
    <button class="btn block" style="margin-top:20px" type="submit" id="f_btn">Book my call</button>
    <div id="f_out" aria-live="polite"></div>
  </form>

  <ul class="assure" style="margin-top:22px">
    <li><svg class="i" aria-hidden="true"><use href="#i-check"/></svg>Local to Wichita</li>
    <li><svg class="i" aria-hidden="true"><use href="#i-check"/></svg>Month-to-month</li>
    <li><svg class="i" aria-hidden="true"><use href="#i-check"/></svg>Set up for you</li>
  </ul>
</main>

<p class="page-foot">&copy; <span id="yr">2026</span> Nexa Lead. Wichita, Kansas. <a href="privacy.html">Privacy policy</a></p>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol></defs></svg>
<script src="assets/form.js" defer></script>
</body>
</html>
